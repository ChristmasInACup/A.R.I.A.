name: .NET

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Aria.sln

      - name: Build
        run: dotnet build Aria.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Aria.sln --configuration Release --no-build --verbosity normal
